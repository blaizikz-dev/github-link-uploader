name: Download from Commit & Save to Repo
on:
  push:
    branches:
      - "**"
jobs:
  save-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install aria2
        run: sudo apt-get install -y aria2

      - name: Extract URLs and download files
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"

          if echo "$MSG" | grep -qP 'download-zip:'; then
            MODE="zip"
            URL_LINE=$(echo "$MSG" | grep -oP 'download-zip:\s*\K.*')
          elif echo "$MSG" | grep -qP 'download:'; then
            MODE="normal"
            URL_LINE=$(echo "$MSG" | grep -oP 'download:\s*\K.*')
          else
            echo "❌ No download command found in commit message"
            exit 1
          fi

          echo "Mode: $MODE"
          mkdir -p downloads
          cd downloads

          for URL in $URL_LINE; do
            FILENAME=$(basename "$URL")
            echo "⬇️ Downloading $URL -> $FILENAME"

            aria2c \
              --split=2 \
              --max-connection-per-server=2 \
              --min-split-size=90M \
              . \
              "$URL"
            
            # Check if file exceeds GitHub limit (95MB to be safe)
            if [ -f "$FILENAME" ]; then
              SIZE=$(stat -c%s "$FILENAME")
              if [ "$SIZE" -gt 95000000 ]; then
                echo "⚠️ File exceeds GitHub limit, splitting with split command"
                # Split using standard split command (creates .aa, .ab, etc.)
                split -b 90M "$FILENAME" "${FILENAME}.part."
                rm "$FILENAME"
                
                # Create recombination script
                cat > "recombine_${FILENAME}.sh" << EOF
