name: Download and Store File

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to download'
        required: true
        type: string
      filename:
        description: 'Output filename'
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file
        run: |
          curl -L -o "${{ github.event.inputs.filename }}" \
            --connect-timeout 30 \
            --max-time 300 \
            --retry 3 \
            "${{ github.event.inputs.url }}"

      - name: Check file size and setup LFS if needed
        run: |
          filesize=$(stat -c%s "${{ github.event.inputs.filename }}")
          if [ $filesize -gt 90000000 ]; then
            echo "File larger than 90MB, using Git LFS"
            git lfs install
            git lfs track "${{ github.event.inputs.filename }}"
            git add .gitattributes
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.filename }}"
          git commit -m "Add ${{ github.event.inputs.filename }}" || echo "No changes to commit"
          git push origin master
